server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    client_max_body_size 20m;

    # Resolver de Docker + variable en fastcgi_pass: sin esto, nginx resuelve
    # "app" una sola vez al arrancar y cachea esa IP para siempre — si el
    # contenedor "app" se recrea (rebuild, restart) con una IP nueva, nginx
    # queda apuntando a la IP vieja hasta que alguien lo reinicie a mano.
    resolver 127.0.0.11 valid=10s;
    set $app_upstream app:9000;

    location = /health {
        access_log off;
        try_files /index.php =404;
        fastcgi_pass $app_upstream;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        include fastcgi_params;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass $app_upstream;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~* \.(css|js|svg|png|jpg|jpeg|gif|ico|woff|woff2|ttf)$ {
        expires 7d;
        access_log off;
    }
}
